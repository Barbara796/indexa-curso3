
<header class="encabezado">

    @if(!pantallaInicial){
        <div>
            <button class="link">
              <img class="seta" src="arrow-left.svg" alt="">
              <a routerLink="/lista-contactos">Regresar</a>
            </button>
          </div>
    }

    <img [src]="bannerSrc()" class="banner">
    <h1
      [ngClass]="pantallaInicial() ? 'titulo' : 'titulo-form'"
      [innerHTML]="titulo()">
    </h1>
</header>
