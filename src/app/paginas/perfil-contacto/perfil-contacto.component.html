<app-container>
  <app-encabezado
    [bannerSrc]="'perfil-contacto.png'"
    [titulo]="'Perfil del contacto'">
  </app-encabezado>
    
  <section class="perfil">
    <div class="imagen-perfil">
      <img [src]="contacto.avatar" alt="">
      <h2>{{contacto.nombre}}</h2>
    </div>
    <app-separador></app-separador>
    <ul>
      <li>
        <i class="material-icons">call</i>
        <strong>Teléfono</strong>
      </li>
      <li>{{ contacto.telefono }}</li>
      <li>
        <i class="material-icons">mail</i>
        <strong>Email</strong>
      </li>
      <li>{{ contacto.email }}</li>
      <li>
        <i class="material-icons">event_available</i>
        <strong>Fecha de nacimiento</strong>
      </li>
      <li>{{ contacto.cumpleano}}</li>
      <li>
        <i class="material-icons">languaje</i>
        <strong>Redes sociales</strong>
      </li>
      <li>{{ contacto.redes }}</li>
    </ul>
    <div class="botones">
      <button (click)="borrar()" class="boton-borrar">
        Borrar contacto
      </button>
      <button class="boton-editar">
        Editar
      </button>
    </div>
  </section>

</app-container>
